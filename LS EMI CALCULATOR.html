<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पर्सनल पीसी EMI कैलकुलेटर</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-amber-400">कंप्यूटर EMI कैलकुलेटर</h1>
      <p class="text-xs text-slate-400 mt-1">50% डाउन पेमेंट • 5% प्रति माह ब्याज</p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300">कंप्यूटर की कुल कीमत (₹)</label>
        <input type="number" id="totalPrice" value="23000" class="w-full mt-1 p-3 bg-slate-900 border border-slate-700 rounded-xl text-lg font-bold text-emerald-400 focus:outline-none focus:border-amber-400" oninput="calculate()">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <span class="text-[11px] text-slate-400 block">डाउन पेमेंट (50%)</span>
          <span class="text-base font-bold text-slate-100" id="downPaymentText">₹11,500</span>
        </div>
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <span class="text-[11px] text-slate-400 block">बाकी लोन (असल)</span>
          <span class="text-base font-bold text-slate-100" id="loanAmountText">₹11,500</span>
        </div>
      </div>

      <!-- Month Selector Buttons -->
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-2">अवधि चुनें (महीने):</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="setMonths(3)" id="btn-3" class="month-btn py-2.5 rounded-xl font-bold text-sm bg-amber-500 text-slate-950 shadow-md">3 माह</button>
          <button type="button" onclick="setMonths(6)" id="btn-6" class="month-btn py-2.5 rounded-xl font-bold text-sm bg-slate-700 text-slate-200 hover:bg-slate-600">6 माह</button>
          <button type="button" onclick="setMonths(9)" id="btn-9" class="month-btn py-2.5 rounded-xl font-bold text-sm bg-slate-700 text-slate-200 hover:bg-slate-600">9 माह</button>
        </div>
      </div>
    </div>

    <!-- Calculation Results Card -->
    <div class="mt-6 bg-slate-950/80 p-5 rounded-2xl border border-slate-700/80 space-y-3">
      <div class="flex justify-between items-baseline border-b border-slate-800 pb-3">
        <span class="text-sm font-semibold text-slate-300">मासिक क़िस्त (EMI):</span>
        <span class="text-2xl font-extrabold text-amber-400" id="monthlyEmi">₹4,408</span>
      </div>

      <div class="flex justify-between text-xs text-slate-400">
        <span>असल रकम (Principal):</span>
        <span class="font-semibold text-slate-200" id="resPrincipal">₹11,500</span>
      </div>

      <div class="flex justify-between text-xs text-slate-400">
        <span>कुल ब्याज (5%/माह):</span>
        <span class="font-semibold text-rose-400" id="resInterest">₹1,725</span>
      </div>

      <div class="flex justify-between text-xs text-slate-400 border-t border-slate-800 pt-2">
        <span>क़िस्त में कुल वापसी:</span>
        <span class="font-semibold text-slate-200" id="resTotalRepay">₹13,225</span>
      </div>

      <div class="flex justify-between text-xs text-emerald-400 font-bold border-t border-slate-800 pt-2">
        <span>DP + क़िस्त कुल वसूली:</span>
        <span id="resGrandTotal">₹24,725</span>
      </div>
    </div>
  </div>

  <script>
    let selectedMonths = 3;
    const monthlyRate = 0.05; // 5% प्रति माह

    function setMonths(m) {
      selectedMonths = m;
      document.querySelectorAll('.month-btn').forEach(btn => {
        btn.className = 'month-btn py-2.5 rounded-xl font-bold text-sm bg-slate-700 text-slate-200 hover:bg-slate-600 transition';
      });
      document.getElementById(`btn-${m}`).className = 'month-btn py-2.5 rounded-xl font-bold text-sm bg-amber-500 text-slate-950 shadow-md transition';
      calculate();
    }

    function calculate() {
      const price = parseFloat(document.getElementById('totalPrice').value) || 0;
      const downPayment = price * 0.50;
      const principal = price * 0.50;

      // 5% flat per month calculation
      const monthlyInterestAmount = principal * monthlyRate;
      const totalInterest = monthlyInterestAmount * selectedMonths;
      const totalRepayment = principal + totalInterest;
      const emi = selectedMonths > 0 ? (totalRepayment / selectedMonths) : 0;
      const grandTotal = downPayment + totalRepayment;

      document.getElementById('downPaymentText').innerText = '₹' + Math.round(downPayment).toLocaleString('en-IN');
      document.getElementById('loanAmountText').innerText = '₹' + Math.round(principal).toLocaleString('en-IN');
      
      document.getElementById('monthlyEmi').innerText = '₹' + Math.round(emi).toLocaleString('en-IN');
      document.getElementById('resPrincipal').innerText = '₹' + Math.round(principal).toLocaleString('en-IN');
      document.getElementById('resInterest').innerText = '₹' + Math.round(totalInterest).toLocaleString('en-IN');
      document.getElementById('resTotalRepay').innerText = '₹' + Math.round(totalRepayment).toLocaleString('en-IN');
      document.getElementById('resGrandTotal').innerText = '₹' + Math.round(grandTotal).toLocaleString('en-IN');
    }

    calculate();
  </script>
</body>
</html>
